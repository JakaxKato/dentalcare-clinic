name: CI

on:
  push:
    branches: [main, setup-main]
  pull_request:
    branches: [main, setup-main]

jobs:
  server-test:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Run tests
        env:
          NODE_ENV: test
          JWT_SECRET: testtesttesttesttesttesttesttest
          MONGO_URI: mongodb://127.0.0.1:27017/dentalcare-ci
          CLIENT_URL: http://localhost:5173
        run: npm test

  client-build:
    name: Client build + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        env:
          VITE_API_URL: http://localhost:5000
        run: npm run build

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [server-test, client-build]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build server image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: false
          tags: dentalcare-server:ci
      - name: Build client image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: false
          tags: dentalcare-client:ci
          build-args: |
            VITE_API_URL=http://localhost:5000

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [server-test, client-build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/setup-main'
    steps:
      - name: SSH into server and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # deploy.sh applies backend deps (npm ci --omit=dev), builds the
          # frontend, copies dist, reloads PM2, and runs an API health check.
          # Branch is passed explicitly so CI deploys the branch it built.
          script: |
            cd /opt/dentalcare
            bash deploy/deploy.sh ${{ github.ref_name }}
