# DentalCare — Nginx site config (API saja; frontend SPA di Vercel)
# Place at: /etc/nginx/sites-available/api-smiledental
# Symlink:  ln -s /etc/nginx/sites-available/api-smiledental /etc/nginx/sites-enabled/
#
# Frontend SPA dilayani Vercel (smiledental.my.id → www.smiledental.my.id).
# VPS hanya melayani API + file upload lokal (/uploads/).
# Terbitkan TLS setelah file ini aktif dan `nginx -t` lolos:
#   sudo certbot --nginx --cert-name api.smiledental.my.id -d api.smiledental.my.id --redirect

# Rate limiting — auth endpoints get strict limits
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

server {
  listen 80;
  server_name api.smiledental.my.id;

  server_tokens off;
  client_max_body_size 10m;
  limit_req_status 429;

  # ---- Rate limit auth endpoints ----
  location ~ ^/api/auth/(login|register|forgot-password|reset-password) {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ---- API + uploaded images → Express (PM2) ----
  location / {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# SSL (listen 443) dan redirect HTTP→HTTPS ditambahkan otomatis oleh certbot --nginx.
