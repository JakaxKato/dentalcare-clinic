# DentalCare — Nginx site config (bare-metal, Tencent Cloud VPS)
# Place at: /etc/nginx/sites-available/dentalcare
# Symlink:  ln -s /etc/nginx/sites-available/dentalcare /etc/nginx/sites-enabled/

# Rate limiting — auth endpoints get strict limits
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

server {
  listen 80;
  server_name _;  # Ganti dengan domain kamu, atau biarkan _ untuk IP-only

  root /var/www/dentalcare/client/dist;
  index index.html;

  server_tokens off;
  client_max_body_size 10m;

  # ---- Security headers ----
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
  # Uncomment setelah certbot berhasil (SSL aktif).
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://res.cloudinary.com https://*.cloudinary.com; script-src 'self' 'unsafe-inline' https://app.sandbox.midtrans.com https://app.midtrans.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' https://api.midtrans.com https://api.sandbox.midtrans.com; frame-src https://app.sandbox.midtrans.com https://app.midtrans.com https://www.google.com https://maps.google.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

  # ---- Gzip ----
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
  gzip_min_length 1024;

  # ---- API proxy → Express (PM2) ----
  location ^~ /api/ {
    # Rate limit auth endpoints
    location ~ ^/api/auth/(login|register|forgot-password|reset-password) {
      limit_req zone=auth burst=5 nodelay;
      proxy_pass http://127.0.0.1:5000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ---- Uploaded images served by Express ----
  location ^~ /uploads/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ---- SPA fallback ----
  location / {
    try_files $uri $uri/ /index.html;
  }

  # ---- Cache hashed assets 1 year ----
  location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # ---- Service worker: never cache ----
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }
}

# SSL block — certbot akan menambahkan konfigurasi HTTPS di sini.
# Setelah certbot selesai, server block di atas akan otomatis redirect ke HTTPS.
