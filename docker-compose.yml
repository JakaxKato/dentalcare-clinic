# ============================================================
# DentalCare — Single-host production stack
# ============================================================
# Usage:
#   1. Copy env templates:
#        cp server/.env.production.example server/.env
#        cp client/.env.production.example client/.env
#   2. Edit both .env files with real production values. Do not use the
#      bundled MongoDB as a substitute for a dedicated production database.
#   3. docker compose up -d --build
#
# Exposes:
#   - http://localhost          → client (nginx)
#   - http://localhost:5000/api → API server
#   - mongo is internal-only (not published)

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 30s
      timeout: 5s
      retries: 3

  server:
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    # Configure MONGO_URI in server/.env. Use a dedicated demo URI when using
    # the bundled MongoDB; production must use its dedicated production database.
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - server_uploads:/app/uploads

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_MIDTRANS_CLIENT_KEY: ${VITE_MIDTRANS_CLIENT_KEY:-}
        VITE_MIDTRANS_IS_PRODUCTION: ${VITE_MIDTRANS_IS_PRODUCTION:-false}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"

volumes:
  mongo_data:
  server_uploads:
